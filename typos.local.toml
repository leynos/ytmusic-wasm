# Repository-specific exceptions to the shared en-GB-oxendict policy.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
  # Cargo requires this exact environment variable.
  '\bCARGO_TERM_COLOR\b',
  # GitHub requires this exact pull-request event type.
  'types: \[opened, reopened, synchronize, labeled, ready_for_review\]',
  # Preserve exact formal upstream documentation titles across wrapped lines.
  'Azure Architecture\s+Center \| Microsoft Learn',
  'GitHub Flavored\s+Markdown \(GFM\)',
  'LogRocket Blog — Organizing Rust tests',
]

[files]
exclude = []
