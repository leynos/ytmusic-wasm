name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          expect-cache: any
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@81374b6f183e59f0570ad36217ded90d3240fda6
        with:
          version: "0.6.1"
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Setup uv
        uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          # A Rust-only repository has no Python dependency manifest for the
          # cache key, so caching would only warn about unmatched inputs.
          enable-cache: false
      - name: Install Markdown diagram tooling
        run: |
          uv tool install nixie-cli==1.1.0
          cargo install merman-cli --version 0.7.0 --locked
      - name: Spelling
        run: make spelling
      - name: Mermaid diagrams
        run: make nixie
      - name: Install Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@81374b6f183e59f0570ad36217ded90d3240fda6
      - name: Install mold linker
        # The Makefile restates the build standard's `mold` flag for its
        # gate targets, so the linker must be present before they build.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mold
      - name: Lint
        run: make lint
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@81374b6f183e59f0570ad36217ded90d3240fda6
        env:
          # The development profile selects Cranelift, which cannot build
          # `-Cinstrument-coverage`; the test profile inherits it. The
          # action's own `cargo install` runs outside the workspace
          # configuration, so it needs the unstable feature from the
          # environment to accept the profile key.
          CARGO_UNSTABLE_CODEGEN_BACKEND: "true"
          CARGO_PROFILE_DEV_CODEGEN_BACKEND: llvm
        with:
          output-path: lcov.info
          format: lcov
          # The pull request measures coverage for its own ratchet check and
          # nothing else: it neither publishes the report nor contacts
          # CodeScene. Main owns both, in coverage-main.yml, and
          # `make test-workflow-contracts` holds the split.
          with-ratchet: 'true'
          publish-artefact: 'false'
